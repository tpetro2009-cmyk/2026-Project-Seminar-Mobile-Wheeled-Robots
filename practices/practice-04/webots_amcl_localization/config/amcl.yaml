amcl:
  ros__parameters:
    use_sim_time: true

    # Системы координат
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    tf_broadcast: true

    # Лазерный сканер
    scan_topic: /scan
    laser_model_type: likelihood_field
    max_beams: 60
    laser_max_range: 3.5
    laser_min_range: 0.12
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    z_hit: 0.8
    z_rand: 0.2
    lambda_short: 0.1

    # Модель движения
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Частота обновления
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.5
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Начальная локализация
    set_initial_pose: false
    # initial_pose:
    #   x: 1.68
    #   y: 0.56
    #   yaw: 1.62
    always_reset_initial_pose: false
    first_map_only: true
    save_pose_rate: 0.5

    # Значения по умолчанию — малый набор частиц
    min_particles: 100
    max_particles: 500

    # Режим диагностики
    introspection_mode: "disabled"
